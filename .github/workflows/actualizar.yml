name: Actualizar picks

on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 a. m. hora Colombia
    - cron: "0 23 * * *"   # 6:00 p. m. hora Colombia
  workflow_dispatch:       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar datos
        run: python scripts/actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos actualizados $(date -u '+%Y-%m-%d %H:%M') UTC"
            # Si alguien subió cambios mientras corría, se bajan y se reintenta
            for intento in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Reintentando ($intento)..."
              sleep 5
            done
          fi
